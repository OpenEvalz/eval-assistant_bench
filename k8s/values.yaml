# Kubernetes sandbox profile — assistant_bench (165 samples)
# The FIRST sandboxed eval OpenEvalz onboards: the only k8s-ready eval also marked
# fast, and it needs the web. This is where the egress design earns its keep.
version: 1
eval: assistant_bench
readiness: ready-to-pin
runtimeClass: gvisor

# ── REPLAY IS THE DEFAULT, AND THAT IS THE WHOLE POINT ───────────────────────
# An open-ended web agent needs the open web, which is fundamentally incompatible
# with a strict FQDN allowlist. Rather than hand-wave that away, run in REPLAY:
# a pywb instance inside the release serves previously recorded captures, so the
# sandbox talks to nothing outside the pod and the allowlist is genuinely empty.
# Replay also fixes a measurement problem, not just a security one — live-web
# tasks decay. WebForge reports ~50% of Mind2Web tasks expired within two years;
# WebVoyager reports 22.3% of answers non-deterministic and 75+ tasks broken by
# hard-coded dates. A live run measures the web's drift as much as the model.
mode: replay          # replay | record

egress:
  replay:
    default: deny
    allow: []         # genuinely empty: the browser talks only to in-pod pywb
  record:
    # Used ONLY when refreshing captures, never for scored runs. Derived from the
    # gold_url distribution across the validation split.
    default: deny
    enforce_sni: true
    tcp_only: true
    allow:
      - { fqdn: "*.google.com",       why: "gold_url for 7 of 33 validation tasks; highest-frequency host" }
      - { fqdn: "*.gstatic.com",      why: "google.com pages pull scripts, fonts and reCAPTCHA assets from gstatic" }
      - { fqdn: "*.tripadvisor.com",  why: "gold_url for 3 tasks; aggressive bot defence, verify capture succeeded" }
      - { fqdn: "*.wunderground.com", why: "gold_url for 3 tasks; the clearest date-drift case in the set" }
      - { fqdn: "*.imdb.com",         why: "gold_url for 2 tasks (film/TV metadata)" }
      - { fqdn: "*.zillow.com",       why: "gold_url for 2 tasks; the paper's flagship real-estate use case" }
      - { fqdn: "*.fedex.com",        why: "gold_url for 2 shipping-rate tasks; rates are live, so capture is essential" }
      - { fqdn: "*.dhl.com",          why: "same 2 shipping-comparison tasks as FedEx" }
      - { fqdn: "*.usps.com",         why: "covers pe./postcalc.usps.com for the shipping tasks" }

# WARNING: never set allowDomains to ["*"] — the chart drops toPorts entirely.

images:
  - purpose: inspect tool support
    reference: docker.io/aisiuk/inspect-tool-support
    pin: required
  - purpose: web archive replay
    reference: docker.io/webrecorder/pywb:2.9.1
    pin: required
  - purpose: per-pod DNS
    reference: docker.io/coredns/coredns:1.14.6
    pin: required

resources:
  requests: { cpu: "1500m", memory: "4Gi", ephemeral-storage: "2Gi" }
  limits:   { cpu: "1500m", memory: "4Gi", ephemeral-storage: "4Gi" }   # Guaranteed QoS
  shm: 1Gi        # counts inside the 4Gi, leaving ~3Gi for processes
  note: "chart defaults (500m / 2Gi) are too small for a browser; raise them"
  typical_runtime_minutes: "4-15 per sample; replay lands at the fast end"

capture:
  format: WARC
  refresh_policy: "re-record on a schedule; record the capture date in the bundle"
  why_in_bundle: "a replayed result is only reproducible if the capture it replayed is identified"

security:
  automountServiceAccountToken: false
  serviceAccountCreate: false
  seccompProfile: RuntimeDefault
